<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gowthami &amp; Mohith · Wedding Invitation</title>
    <meta name="description" content="You are warmly invited to the wedding of Gowthami &amp; Mohith. Join us for Haldi, Reception &amp; Wedding Ceremony on 19–20 November 2026." />
    <meta name="robots" content="noindex" />

    <!-- Mobile browser chrome color -->
    <meta name="theme-color" content="#f7efe2" />
    <!-- iOS full-screen & status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Prevent iOS tap callout & double-tap zoom -->
    <meta name="format-detection" content="telephone=no" />

    <!-- DNS prefetch for fonts CDN -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preconnect to establish early connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts with display=swap so text shows immediately in fallback font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
